name: CI/CD Pipeline - MeNotes Self-Hosted

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan deploy manual langsung dari tab Actions di GitHub

# Pastikan hanya 1 deployment berjalan pada satu waktu untuk menghindari konflik container
concurrency:
  group: deploy-menotes
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Container
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false # Pertahankan konfigurasi lokal yang tidak di-track Git

      - name: Setup Environment (.env)
        run: |
          echo "⚙️ [1/5] Mempersiapkan file konfigurasi environment (.env)..."
          
          # Buat file .env jika belum ada dari template .env.example
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "✅ File .env berhasil dibuat dari .env.example"
            else
              touch .env
            fi
          fi

          # Update SYNC_SECRET jika diatur di GitHub Repository Secrets
          if [ -n "${{ secrets.SYNC_SECRET }}" ]; then
            if grep -q "^SYNC_SECRET=" .env; then
              sed -i "s/^SYNC_SECRET=.*/SYNC_SECRET=${{ secrets.SYNC_SECRET }}/" .env
            else
              echo "SYNC_SECRET=${{ secrets.SYNC_SECRET }}" >> .env
            fi
            echo "🔐 SYNC_SECRET diperbarui dari GitHub Secrets."
          fi

          # Update PORT jika diatur di GitHub Repository Secrets
          if [ -n "${{ secrets.PORT }}" ]; then
            if grep -q "^PORT=" .env; then
              sed -i "s/^PORT=.*/PORT=${{ secrets.PORT }}/" .env
            else
              echo "PORT=${{ secrets.PORT }}" >> .env
            fi
            echo "🌐 PORT diperbarui dari GitHub Secrets."
          fi

          # Pastikan nilai standar selalu ada
          grep -q "^PORT=" .env || echo "PORT=3000" >> .env
          grep -q "^NODE_ENV=" .env || echo "NODE_ENV=production" >> .env
          grep -q "^DATA_DIR=" .env || echo "DATA_DIR=/app/data" >> .env
          grep -q "^SYNC_SECRET=" .env || echo "SYNC_SECRET=akuiki26" >> .env

      - name: Verify Docker & Docker Compose
        run: |
          echo "🔍 [2/5] Memeriksa instalasi Docker & Docker Compose..."
          docker --version
          
          if docker compose version >/dev/null 2>&1; then
            echo "DOCKER_COMPOSE_CMD=docker compose" >> $GITHUB_ENV
            echo "✅ Menggunakan 'docker compose' (v2)"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "DOCKER_COMPOSE_CMD=docker-compose" >> $GITHUB_ENV
            echo "✅ Menggunakan 'docker-compose' (v1)"
          else
            echo "❌ Docker Compose tidak ditemukan di server self-hosted!"
            exit 1
          fi

      - name: Build & Start Container
        run: |
          echo "🐳 [3/5] Membangun ulang dan menyalakan container MeNotes..."
          $DOCKER_COMPOSE_CMD up -d --build --remove-orphans

      - name: Verify Health Check
        run: |
          echo "🩺 [4/5] Memeriksa status kesehatan aplikasi (/api/health)..."
          PORT_VAL=$(grep -E '^PORT=' .env | cut -d '=' -f2 | tr -d ' ' || echo "3000")
          HEALTH_URL="http://127.0.0.1:${PORT_VAL}/api/health"
          echo "Target Health Check: $HEALTH_URL"

          SUCCESS=0
          for i in $(seq 1 15); do
            echo "Memeriksa status ($i/15)..."
            if curl -fsS "$HEALTH_URL" > /dev/null 2>&1; then
              SUCCESS=1
              break
            fi
            sleep 3
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "===================================================="
            echo "✅ MeNotes berhasil aktif dan sehat di port $PORT_VAL!"
            echo "===================================================="
          else
            echo "❌ MeNotes gagal merespons health check! Log container:"
            $DOCKER_COMPOSE_CMD logs --tail=50
            exit 1
          fi

      - name: Clean Up Unused Docker Images
        if: always()
        run: |
          echo "🧹 [5/5] Membersihkan image Docker lama yang tidak terpakai..."
          docker image prune -f

