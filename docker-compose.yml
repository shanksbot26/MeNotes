services:
  menotes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menotes-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistent SQLite database storage on host machine
      - ./data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATA_DIR=${DATA_DIR:-/app/data}
      - SYNC_SECRET=${SYNC_SECRET:-}
